[project]
name = "agent-wait-aws"
version = "0.2.0"
description = "AWS backends for agent-wait: DynamoDB store, SQS/SNS/EventBridge/Scheduler announce, Lambda wrapper."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kamaljeet Singh" }]
dependencies = ["agent-wait", "boto3>=1.35"]

[project.urls]
Homepage = "https://github.com/skamalj/agent-wait"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_wait_aws"]

[tool.uv.sources]
agent-wait = { workspace = true }
