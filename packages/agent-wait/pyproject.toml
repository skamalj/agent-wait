[project]
name = "agent-wait"
version = "0.1.0"
description = "Durable waits for agent frameworks: park an interrupt, answer it days later, resume anywhere."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kamaljeet Singh" }]
keywords = ["agents", "human-in-the-loop", "durable", "interrupt", "workflow"]
dependencies = []

[project.urls]
Homepage = "https://github.com/skamalj/agent-wait"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_wait"]
