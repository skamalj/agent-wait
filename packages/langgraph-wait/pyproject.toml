[project]
name = "langgraph-wait"
version = "0.2.0"
description = "LangGraph adapter for agent-wait: ask() and the framework adapter."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kamaljeet Singh" }]
dependencies = ["agent-wait", "langgraph>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/skamalj/agent-wait"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_wait"]

[tool.uv.sources]
agent-wait = { workspace = true }
