name: release

# Publishes agent-wait to PyPI when a v* tag is pushed, then proves the published
# artefact works by installing them from PyPI -- not from the build -- into a clean
# environment and running a smoke test that exercises the public API end to end.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish and smoke-test (e.g. 0.2.0). Defaults to the tag name."
        required: false

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras
      - run: uv run pytest
      - run: uv run ruff check . && uv run pyright
      - run: uv build --out-dir dist
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v4
      - id: token
        run: echo "present=${{ secrets.PYPI_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      # --check-url skips files already on the index, so re-running a tag (or tagging a
      # version that was published by hand) is a no-op rather than a 400.
      - if: steps.token.outputs.present == 'true'
        run: uv publish --check-url https://pypi.org/simple/ dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      - if: steps.token.outputs.present != 'true'
        run: echo "PYPI_API_TOKEN is not set; skipping upload. The smoke test below still runs against whatever PyPI serves for this version."

  smoke-from-pypi:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/smoke_from_pypi.py
      - uses: astral-sh/setup-uv@v4
      - name: install from PyPI into a clean venv and run the smoke test
        # The venv comes first: `uv pip` refuses to run without one, and a wait loop
        # that cannot tell "not on the index yet" from "no venv" waits forever.
        run: |
          VERSION="${RELEASE_VERSION#v}"
          uv venv .smoke && . .smoke/bin/activate
          for i in $(seq 1 30); do
            if uv pip install --no-cache "agent-wait[langgraph,aws]==$VERSION"; then break; fi
            [ "$i" = 30 ] && { echo "agent-wait==$VERSION never became installable from PyPI"; exit 1; }
            sleep 10
          done
          python scripts/smoke_from_pypi.py
