[project]
name = "agent-wait"
version = "0.6.0"
description = "Human-in-the-loop for LangGraph and Pydantic AI agents -- and anything else a run has to wait for. Get the interrupt out of the process (SNS, SQS, EventBridge, DynamoDB, webhook) with everything needed to answer it; get the answer back in."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kamaljeet Singh", email = "skamalj@gmail.com" }]
keywords = [
    "human-in-the-loop",
    "hitl",
    "approval",
    "langgraph",
    "langchain",
    "pydantic-ai",
    "agents",
    "interrupt",
    "durable",
    "serverless",
    "lambda",
    "sqs",
    "sns",
    "eventbridge",
    "dynamodb",
    "webhook",
    "callback",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
langgraph = ["langgraph>=1.2,<2"]
pydantic-ai = ["pydantic-ai-slim>=2.43,<3"]
aws = ["boto3>=1.35"]
all = ["agent-wait[langgraph,pydantic-ai,aws]"]

[project.urls]
Homepage = "https://skamalj.github.io/agent-wait/"
Documentation = "https://skamalj.github.io/agent-wait/"
Source = "https://github.com/skamalj/agent-wait"
Issues = "https://github.com/skamalj/agent-wait/issues"
Changelog = "https://github.com/skamalj/agent-wait/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_wait"]

[tool.hatch.build.targets.sdist]
include = ["src/agent_wait", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "agent-wait[all]",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "moto[dynamodb,sqs,sns,events]>=5.0",
    "boto3-stubs[dynamodb,sqs,sns,events]>=1.35",
    "langgraph-checkpoint-sqlite>=2.0",
    "aws-cdk-lib>=2.160",
    "constructs>=10.3",
]

[tool.uv.sources]
agent-wait = { workspace = true }

[tool.uv.workspace]
members = ["."]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
addopts = "-q --strict-markers"
norecursedirs = ["cdk.out", "build", ".venv", "reference"]
markers = [
    "e2e: requires real AWS; opt in with AGENT_WAIT_E2E=1",
    "spike: empirical probes of LangGraph behaviour",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["reference", "cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pyright]
include = ["src"]
exclude = ["reference", "**/node_modules", "**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
